name: Google Scholar Stats

on:
  push:
    branches: [master]
    paths: ['.github/workflows/google-scholar-stats.yml', 'google_scholar_crawler/**']
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'  # 每天北京时间 05:30

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation stats (Scholar first, OpenAlex fallback)
        env:
          GOOGLE_SCHOLAR_ID: BhA6vd0AAAAJ
          ORCID: 0000-0001-9146-051X
        run: python google_scholar_crawler/main.py

      - name: Commit updated stats
        run: |
          mkdir -p google-scholar-stats
          cp results/gs_data_shieldsio.json google-scholar-stats/
          cp results/gs_data.json google-scholar-stats/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-scholar-stats
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update citation stats [skip ci]"
            git pull --rebase origin master || true
            git push
          fi
